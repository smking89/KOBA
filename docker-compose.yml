services:
  postgres:
    image: postgres:16-alpine
    container_name: koba-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: koba
      POSTGRES_PASSWORD: koba
      POSTGRES_DB: koba
    volumes:
      - koba_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koba -d koba"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  koba_pg_data:
